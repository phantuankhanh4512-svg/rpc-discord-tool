<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPC & Quest Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0d0f14; color: #e1e4ea; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #151921; border: 1px solid #252b36; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { font-size: 18px; color: #fff; margin-bottom: 15px; text-align: center; }
    label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; margin-top: 15px; }
    label:first-of-type { margin-top: 0; }
    input, select, textarea { width: 100%; background: #0b0e13; border: 1px solid #2b3240; border-radius: 6px; padding: 10px 12px; color: #fff; font-family: monospace; font-size: 13px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #5865f2; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 14px; border: none; border-radius: 6px; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 20px; }
    .btn-start { background: #22c55e; color: #04130a; }
    .btn-quest { background: #5865f2; color: #fff; }
    .btn-stop { background: #ef4444; }
    #status { margin-top: 15px; text-align: center; font-size: 13px; font-weight: 600; color: #9ca3af; }
    
    /* CSS cho thanh tiến trình */
    .progress-container { margin-top: 15px; background: #0b0e13; border-radius: 6px; border: 1px solid #2b3240; overflow: hidden; height: 20px; position: relative; display: none; }
    .progress-bar { height: 100%; background: #5865f2; width: 0%; transition: width 0.3s ease; }
    .progress-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
    .log-box { margin-top: 15px; background: #000; border: 1px solid #333; border-radius: 6px; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #22c55e; display: none; }
    .log-box p { margin-bottom: 4px; line-height: 1.4; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>⚡ RPC Configurator</h2>
    
    <label>Token Discord</label>
    <input id="token" type="password" value="OTExODc0MjIyMzM3NDUwMDI1.GAVLc4.14ptyF_MC1JptSSiW0pLiwQDevY0Q7SH-BxMVI">

    <label>Tên Game (Name)</label>
    <input id="name" type="text" placeholder="Visual Studio Code">

    <label>Dòng 1 (Details)</label>
    <input id="details" type="text" placeholder="Workspace: tinhdiem-bot">

    <label>Dòng 2 (State - xoay vòng)</label>
    <textarea id="state" rows="3">Editing server.js
Editing td.js</textarea>

    <label>Link ảnh (Image URL)</label>
    <input id="largeImage" type="text" placeholder="https://i.ibb.co/.../anh.png">

    <label>Số giờ Fake Time</label>
    <input id="hours" type="number" value="1700">

    <label>Delay chữ (Giây)</label>
    <input id="delay" type="number" value="4">
    
    <div class="row" style="margin-top: 15px;">
      <div>
        <label>Nút 1 (Tên)</label>
        <input id="btn1Label" type="text" placeholder="My Website">
      </div>
      <div>
        <label>Nút 1 (Link)</label>
        <input id="btn1Url" type="text" placeholder="https://...">
      </div>
    </div>

    <div class="row">
      <button id="btnStart" class="btn-start" onclick="start()">Bắt đầu RPC</button>
      <button id="btnStop" class="btn-stop" onclick="stop()" disabled>Dừng</button>
    </div>
    <div id="status">Chờ lệnh...</div>
  </div>

  <div class="card">
    <h2>🎮 AutoQuest</h2>
    <p style="font-size: 12px; color: #9ca3af; margin-bottom: 10px;">Tự động cày Quest xem video. Hãy kiểm tra token trước khi chạy.</p>
    <button class="btn-quest" id="btnQuest" onclick="startQuest()">Kiểm tra & Chạy AutoQuest</button>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <div id="quest-status" style="margin-top: 10px; text-align: center; font-size: 13px; color: #9ca3af;"></div>
    
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function checkStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.online) {
      $('btnStart').disabled = true;
      $('btnStop').disabled = false;
      $('status').innerText = 'Đang treo 24/7';
      $('status').style.color = '#22c55e';
    } else {
      $('btnStart').disabled = false;
      $('btnStop').disabled = true;
      $('status').innerText = 'Chưa kết nối';
      $('status').style.color = '#9ca3af';
    }
  } catch(e){}
}

async function start() {
  const token = $('token').value;
  if (!token) return alert('Nhập token đã!');
  $('status').innerText = 'Đang kết nối...';
  $('status').style.color = '#eab308';
  
  const payload = {
    token: token,
    name: $('name').value,
    details: $('details').value,
    states: $('state').value.split('\n').filter(x => x.trim() !== ''),
    largeImage: $('largeImage').value,
    hours: $('hours').value,
    delay: $('delay').value,
    type: 0,
    platform: 'desktop',
    status: 'online',
    btn1: { label: $('btn1Label').value, url: $('btn1Url').value }
  };

  try {
    const res = await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (res.ok) checkStatus();
  } catch(e) { $('status').innerText = 'Lỗi kết nối'; $('status').style.color = '#ef4444'; }
}

async function stop() {
  await fetch('/api/stop', { method: 'POST' });
  checkStatus();
}

// ==============================
// LOGIC AUTOQUEST MỚI
// ==============================
let questPoller = null;

async function startQuest() {
  const token = $('token').value;
  if (!token) return alert('Nhập token ở trên trước!');
  
  const btn = $('btnQuest');
  btn.disabled = true;
  btn.innerText = "Đang kiểm tra token...";
  
  $('quest-status').innerText = "Đang xác thực...";
  $('quest-status').style.color = "#eab308";
  $('logBox').style.display = 'block';
  $('logBox').innerHTML = '';
  $('progressContainer').style.display = 'block';
  $('progressBar').style.width = '0%';
  $('progressText').innerText = '0%';

  // 1. Kiểm tra token trước
  try {
    const vRes = await fetch('/api/validate-token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token })
    });
    const vData = await vRes.json();
    
    if (!vData.ok) {
      $('quest-status').innerText = vData.msg;
      $('quest-status').style.color = "#ef4444";
      btn.disabled = false;
      btn.innerText = "Kiểm tra & Chạy AutoQuest";
      return;
    }
    
    // Token hợp lệ
    $('quest-status').innerText = "Token hợp lệ. Bắt đầu chạy...";
    $('logBox').innerHTML += `<p>[System] Token hợp lệ (${vData.username})</p>`;
    
  } catch (e) {
    $('quest-status').innerText = "Lỗi kiểm tra token";
    $('quest-status').style.color = "#ef4444";
    btn.disabled = false;
    btn.innerText = "Kiểm tra & Chạy AutoQuest";
    return;
  }

  // 2. Gọi API bắt đầu chạy
  try {
    const res = await fetch('/api/autoquest', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token })
    });
    const data = await res.json();
    
    if (data.ok) {
      btn.innerText = "Đang chạy AutoQuest...";
      // Bắt đầu poll trạng thái
      questPoller = setInterval(pollQuest, 1000);
    } else {
      $('quest-status').innerText = data.msg;
      $('quest-status').style.color = "#ef4444";
      btn.disabled = false;
      btn.innerText = "Kiểm tra & Chạy AutoQuest";
    }
  } catch (e) {
    $('quest-status').innerText = "Lỗi gửi lệnh chạy";
    $('quest-status').style.color = "#ef4444";
    btn.disabled = false;
    btn.innerText = "Kiểm tra & Chạy AutoQuest";
  }
}

async function pollQuest() {
  try {
    const res = await fetch('/api/quest-status');
    const data = await res.json();
    
    // Cập nhật thanh tiến trình
    if (data.total > 0) {
      const pct = Math.floor((data.completed / data.total) * 100);
      $('progressBar').style.width = pct + '%';
      $('progressText').innerText = pct + '% (' + data.completed + '/' + data.total + ')';
    }

    // Cập nhật log
    if (data.logs && data.logs.length > 0) {
      $('logBox').innerHTML = data.logs.map(l => `<p>${l}</p>`).join('');
      $('logBox').scrollTop = $('logBox').scrollHeight;
    }
    
    // Cập nhật action hiện tại
    $('quest-status').innerText = data.currentAction;
    $('quest-status').style.color = data.running ? '#5865f2' : '#22c55e';

    // Nếu chạy xong
    if (!data.running && data.currentAction !== "Chờ lệnh...") {
      clearInterval(questPoller);
      $('btnQuest').disabled = false;
      $('btnQuest').innerText = "Kiểm tra & Chạy AutoQuest";
      $('quest-status').innerText = data.currentAction;
      $('quest-status').style.color = data.currentAction === "Hoàn thành" ? '#22c55e' : '#ef4444';
    }
  } catch (e) {}
}

setInterval(checkStatus, 3000);
checkStatus();
</script>
</body>
</html>
